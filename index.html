<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ledger">
<meta name="theme-color" content="#1f2a14">
<title>Ledger</title>
<style>
  :root {
    --bg: #1f2a14;
    --moss-dark: #2f3b1a;
    --moss: #4a5d23;
    --moss-light: #7a8c4a;
    --sage: #a9b388;
    --paper: #f1e7cc;
    --paper-2: #e6d8b3;
    --ink: #2b1d14;
    --gold: #c9a227;
    --gold-light: #e6c766;
    --gold-dark: #8a6b14;
    --wine: #6b1f2b;
    --rose: #b9837f;
    --brown: #5c4033;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Songti SC", "STSong", "Noto Serif SC", Georgia, serif;
    color: var(--ink);
    min-height: 100vh;
    padding: calc(env(safe-area-inset-top) + 16px) 14px calc(env(safe-area-inset-bottom) + 28px);
    -webkit-tap-highlight-color: transparent;
    background-color: var(--bg);
    background-image:
      radial-gradient(circle at 50% 50%, rgba(201,162,39,.18) 1.2px, transparent 1.6px),
      linear-gradient(45deg, rgba(255,255,255,.025) 25%, transparent 25%, transparent 75%, rgba(255,255,255,.025) 75%),
      linear-gradient(-45deg, rgba(255,255,255,.025) 25%, transparent 25%, transparent 75%, rgba(255,255,255,.025) 75%);
    background-size: 28px 28px, 28px 28px, 28px 28px;
  }
  .wrap { max-width: 520px; margin: 0 auto; }

  .flourish { display: flex; align-items: center; gap: 10px; color: var(--gold); font-size: 18px; margin: 4px 0 14px; }
  .flourish::before, .flourish::after {
    content: ""; flex: 1; height: 6px;
    border-top: 1px solid var(--gold); border-bottom: 1px solid var(--gold-dark);
  }

  .card {
    position: relative;
    background: radial-gradient(ellipse at center, #f6eed8 0%, var(--paper) 60%, var(--paper-2) 100%);
    border: 2px solid var(--gold-dark);
    outline: 1px solid var(--gold); outline-offset: -7px;
    box-shadow: 0 0 0 4px var(--moss-dark), 0 0 0 5px var(--gold-dark), 0 8px 18px rgba(0,0,0,.45);
    padding: 22px 18px 18px;
    margin: 0 4px 24px;
  }
  .card::before, .card::after, .corner-b::before, .corner-b::after {
    content: "❦"; position: absolute; color: var(--gold-dark); font-size: 16px; line-height: 1;
  }
  .card::before { top: 3px; left: 5px; transform: rotate(-90deg); }
  .card::after { top: 3px; right: 5px; }
  .corner-b::before { bottom: 3px; left: 5px; transform: rotate(180deg); }
  .corner-b::after { bottom: 3px; right: 5px; transform: rotate(90deg); }

  h2 { text-align: center; font-size: 16px; letter-spacing: 6px; color: var(--wine); margin-bottom: 14px; font-weight: bold; }
  h2::before, h2::after { content: " ✦ "; color: var(--gold-dark); font-size: 12px; }

  /* 顶部标题牌 */
  .banner {
    position: relative;
    margin: 0 4px 24px;
    padding: 40px 16px 0;
    text-align: center;
    border: 2px solid var(--gold-dark);
    border-radius: 120px 120px 4px 4px / 60px 60px 4px 4px;
    box-shadow: 0 0 0 4px var(--moss-dark), 0 0 0 5px var(--gold-dark), 0 8px 18px rgba(0,0,0,.45);
    background:
      radial-gradient(ellipse at 50% 40%, rgba(230,199,102,.28), transparent 60%),
      linear-gradient(#3d4f24, #55692c);
    overflow: hidden;
  }
  .curtain {
    position: absolute; top: 0; left: 0; right: 0; height: 26px;
    background: radial-gradient(circle at 12px 0, var(--wine) 12px, transparent 13px) 0 0 / 24px 26px repeat-x;
    border-bottom: 2px solid var(--gold);
  }
  .banner-orn { color: var(--gold); font-size: 14px; letter-spacing: 8px; margin-bottom: 2px; }
  .banner-title {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 38px; font-style: italic; font-weight: normal; letter-spacing: 3px;
    color: var(--gold-light);
    text-shadow: 0 2px 0 var(--gold-dark), 0 4px 8px rgba(0,0,0,.45);
  }
  .banner-sub { color: var(--paper); font-size: 12px; letter-spacing: 6px; margin-top: 4px; opacity: .85; }
  .banner-date {
    display: inline-block; margin: 10px 0 14px; padding: 3px 14px;
    font-size: 12px; letter-spacing: 2px; color: var(--ink);
    background: var(--paper); border: 1px solid var(--gold-dark);
    box-shadow: 0 0 0 2px var(--moss-dark), 0 0 0 3px var(--gold);
  }
  .banner-floor {
    height: 14px; margin: 0 -16px;
    background: repeating-linear-gradient(90deg, #5c4033 0 14px, #6e4e3d 14px 28px);
    border-top: 2px solid var(--gold);
  }


  /* 统计 */
  .month-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .month-bar span { font-size: 17px; letter-spacing: 2px; color: var(--moss-dark); font-weight: bold; }
  .total { text-align: center; padding: 6px 0 14px; margin-bottom: 14px; }
  .total::after { content: "—— ❧ ——"; display: block; color: var(--gold-dark); font-size: 13px; margin-top: 8px; }
  .total .label { font-size: 12px; letter-spacing: 4px; color: var(--brown); }
  .total .num { font-family: Georgia, "Times New Roman", serif; font-size: 36px; color: var(--wine); letter-spacing: 1px; text-shadow: 0 1px 0 #fff8e4, 0 2px 0 rgba(138,107,20,.35); }
  .stat-row { display: grid; grid-template-columns: 96px 1fr 82px; gap: 8px; align-items: center; font-size: 13px; margin-bottom: 9px; }
  .stat-track { height: 10px; background: var(--paper-2); border: 1px solid var(--gold-dark); border-radius: 5px; overflow: hidden; }
  .stat-fill { height: 100%; border-radius: 5px; }
  .stat-row .amt { text-align: right; font-family: Georgia, serif; }

  /* 表单 */
  label { font-size: 13px; display: block; margin-bottom: 5px; color: var(--brown); letter-spacing: 1px; }
  input {
    width: 100%; font: inherit; font-size: 16px; padding: 10px; background: #fbf6e6; color: var(--ink);
    border: 1px solid var(--gold-dark); border-radius: 2px; box-shadow: inset 0 1px 3px rgba(92,64,51,.25);
    margin-bottom: 12px; -webkit-appearance: none; appearance: none;
  }
  input:focus { outline: 2px solid var(--gold); outline-offset: 1px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .cats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; margin-bottom: 14px; }
  .cat-btn {
    font: inherit; font-size: 12px; padding: 9px 2px 7px;
    background: linear-gradient(#f8f0da, var(--paper-2));
    border: 1px solid var(--gold-dark); border-radius: 3px; cursor: pointer; color: var(--ink);
  }
  .cat-btn .ic { display: block; font-size: 18px; margin-bottom: 3px; color: var(--moss); }
  .cat-btn[aria-pressed="true"] {
    background: linear-gradient(var(--moss), var(--moss-dark)); color: var(--paper);
    border-color: var(--gold); box-shadow: inset 0 0 0 1px var(--gold-dark);
  }
  .cat-btn[aria-pressed="true"] .ic { color: var(--gold-light); }

  .btn {
    font: inherit; font-size: 15px; letter-spacing: 6px; padding: 11px 14px;
    background: linear-gradient(var(--gold-light), var(--gold) 50%, var(--gold-dark));
    color: var(--ink); border: 1px solid var(--gold-dark); border-radius: 3px;
    box-shadow: 0 2px 0 var(--ink), inset 0 1px 0 rgba(255,255,255,.5); cursor: pointer; font-weight: bold;
  }
  .btn:active { transform: translateY(2px); box-shadow: inset 0 1px 0 rgba(255,255,255,.5); }
  .btn.full { width: 100%; }
  .btn.small { font-size: 13px; letter-spacing: 2px; padding: 6px 12px; }
  .btn.ghost { background: linear-gradient(#f8f0da, var(--paper-2)); }

  /* 明细 */
  .day {
    font-size: 12px; color: var(--wine); margin: 14px 0 7px; letter-spacing: 1px;
    display: flex; justify-content: space-between; border-bottom: 1px dotted var(--gold-dark); padding-bottom: 3px;
  }
  .item {
    display: flex; align-items: center; gap: 10px; padding: 9px 10px; margin-bottom: 7px;
    background: #fbf6e6; border: 1px solid var(--paper-2); border-left: 3px solid var(--gold);
  }
  .item .dot { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 50%; border: 1px solid var(--gold); font-size: 14px; flex-shrink: 0; color: var(--paper); }
  .item .info { flex: 1; min-width: 0; }
  .item .info b { font-size: 14px; font-weight: normal; }
  .item .info small { display: block; font-size: 12px; color: var(--brown); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .money { font-family: Georgia, serif; color: var(--wine); }
  .item .del { background: none; border: none; font-size: 15px; color: var(--brown); cursor: pointer; padding: 6px; }
  .empty { text-align: center; color: var(--gold-dark); font-size: 18px; padding: 8px 0; }
  .tools { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
<div class="wrap">
  <div class="flourish" aria-hidden="true">❦</div>

  <header class="banner">
    <div class="curtain" aria-hidden="true"></div>
    <div class="banner-orn" aria-hidden="true">❧ ✦ ☙</div>
    <h1 class="banner-title">Ledger</h1>
    <p class="banner-sub">小 小 账 簿</p>
    <p class="banner-date" id="todayLabel"></p>
    <div class="banner-floor" aria-hidden="true"></div>
  </header>

  <section class="card" aria-labelledby="statTitle">
    <span class="corner-b" aria-hidden="true"></span>
    <div class="month-bar">
      <button class="btn small ghost" id="prevM" aria-label="上个月">◀</button>
      <span id="monthLabel"></span>
      <button class="btn small ghost" id="nextM" aria-label="下个月">▶</button>
    </div>
    <div class="total">
      <div class="label" id="statTitle">本月支出</div>
      <div class="num" id="totalNum">¥0.00</div>
    </div>
    <div id="stats"></div>
  </section>

  <section class="card">
    <span class="corner-b" aria-hidden="true"></span>
    <h2>记一笔</h2>
    <form id="form">
      <label id="catLabel">分类</label>
      <div class="cats" id="cats" role="group" aria-labelledby="catLabel"></div>
      <div class="row2">
        <div>
          <label for="amount">金额 (¥)</label>
          <input id="amount" type="text" inputmode="decimal" placeholder="0.00" required autocomplete="off">
        </div>
        <div>
          <label for="date">日期</label>
          <input id="date" type="date" required>
        </div>
      </div>
      <label for="note">备注</label>
      <input id="note" type="text" maxlength="40" placeholder="买了什么呢…" autocomplete="off">
      <button class="btn full" type="submit">存入</button>
    </form>
  </section>

  <section class="card">
    <span class="corner-b" aria-hidden="true"></span>
    <h2>明细</h2>
    <div id="list"></div>
  </section>

  <section class="card">
    <span class="corner-b" aria-hidden="true"></span>
    <h2>备份</h2>
    <div class="tools">
      <button class="btn small" id="exportBtn">导出</button>
      <label class="btn small ghost" style="margin:0;color:var(--ink)">
        导入<input type="file" id="importFile" accept=".json" class="sr-only">
      </label>
    </div>
  </section>

  <div class="flourish" aria-hidden="true">✦</div>
</div>

<script>
/* ========== 分类 ========== */
const CATS = [
  { id: 'merch',   name: '周边',      ic: '★', color: '#a8655f' },
  { id: 'mood',    name: 'Happiness', ic: '♥', color: '#b9837f' },
  { id: 'daily',   name: '生活',      ic: '⌂', color: '#4a5d23' },
  { id: 'vip',     name: '会员订阅',  ic: '♛', color: '#c9a227' },
  { id: 'ai',      name: 'API',       ic: '◈', color: '#3f6b5e' },
  { id: 'traffic', name: '交通',      ic: '➤', color: '#8a4a2b' },
  { id: 'other',   name: '其他',      ic: '◆', color: '#5c4033' },
];
const catById = id => CATS.find(c => c.id === (id === 'need' ? 'daily' : id)) || CATS[CATS.length - 1];

/* ========== 存储 ========== */
const KEY = 'pixelLedger_v1';
let records = [];
try { records = JSON.parse(localStorage.getItem(KEY)) || []; } catch { records = []; }
records.forEach(r => { if (r.cat === 'need') r.cat = 'daily'; });
const save = () => localStorage.setItem(KEY, JSON.stringify(records));


/* ========== 分类按钮 ========== */
let selectedCat = CATS[0].id;
const catsEl = document.getElementById('cats');
CATS.forEach(c => {
  const btn = document.createElement('button');
  btn.type = 'button'; btn.className = 'cat-btn';
  btn.innerHTML = `<span class="ic" aria-hidden="true">${c.ic}</span>${c.name}`;
  btn.setAttribute('aria-pressed', c.id === selectedCat);
  btn.addEventListener('click', () => {
    selectedCat = c.id;
    catsEl.querySelectorAll('.cat-btn').forEach((b, i) => b.setAttribute('aria-pressed', CATS[i].id === c.id));
  });
  catsEl.appendChild(btn);
});

/* ========== 日期 ========== */
const pad = n => String(n).padStart(2, '0');
const today = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
document.getElementById('date').value = today();
document.getElementById('todayLabel').textContent = (() => { const d = new Date(); return `${d.getFullYear()} 年 ${d.getMonth()+1} 月 ${d.getDate()} 日 · 星期${'日一二三四五六'[d.getDay()]}`; })();
let viewY = new Date().getFullYear(), viewM = new Date().getMonth() + 1;
const ym = () => `${viewY}-${pad(viewM)}`;
document.getElementById('prevM').onclick = () => { if (--viewM < 1) { viewM = 12; viewY--; } render(); };
document.getElementById('nextM').onclick = () => { if (++viewM > 12) { viewM = 1; viewY++; } render(); };

/* ========== 记录 ========== */
const fmt = n => '¥' + n.toFixed(2);
// 用浏览器自带的方式转义备注文字，防止特殊字符破坏页面
const esc = s => { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; };

document.getElementById('form').addEventListener('submit', e => {
  e.preventDefault();
  const amtEl = document.getElementById('amount');
  const amount = Math.round(parseFloat(amtEl.value.replace(/[,，]/g, '.')) * 100) / 100;
  if (!isFinite(amount) || amount <= 0) { amtEl.focus(); alert('请输入正确的金额'); return; }
  const date = document.getElementById('date').value || today();
  records.push({
    id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    cat: selectedCat, amount, date,
    note: document.getElementById('note').value.trim(),
  });
  save();
  amtEl.value = ''; document.getElementById('note').value = '';
  const [y, m] = date.split('-'); viewY = +y; viewM = +m;
  render();
});

function render() {
  document.getElementById('monthLabel').textContent = `${viewY} 年 ${viewM} 月`;
  const list = records.filter(r => r.date.startsWith(ym()));
  const total = list.reduce((s, r) => s + r.amount, 0);
  document.getElementById('totalNum').textContent = fmt(total);

  const sums = {};
  list.forEach(r => { const id = catById(r.cat).id; sums[id] = (sums[id] || 0) + r.amount; });
  const used = CATS.filter(c => sums[c.id]).sort((a, b) => sums[b.id] - sums[a.id]);
  document.getElementById('stats').innerHTML = used.map(c => {
    const pct = total ? sums[c.id] / total * 100 : 0;
    return `<div class="stat-row">
      <span>${c.ic} ${c.name}</span>
      <div class="stat-track" role="img" aria-label="${c.name}占${pct.toFixed(0)}%"><div class="stat-fill" style="width:${pct}%;background:${c.color}"></div></div>
      <span class="amt">${fmt(sums[c.id])}</span>
    </div>`;
  }).join('');

  const listEl = document.getElementById('list');
  if (!list.length) { listEl.innerHTML = '<p class="empty" aria-label="暂无记录">❧</p>'; return; }
  const byDay = {};
  list.forEach(r => (byDay[r.date] = byDay[r.date] || []).push(r));
  listEl.innerHTML = Object.keys(byDay).sort().reverse().map(d => {
    const items = byDay[d];
    const daySum = items.reduce((s, r) => s + r.amount, 0);
    const [, mm, dd] = d.split('-');
    return `<div class="day"><span>${+mm} 月 ${+dd} 日</span><span>${fmt(daySum)}</span></div>` +
      items.map(r => {
        const c = catById(r.cat);
        return `<div class="item">
          <div class="dot" style="background:${c.color}" aria-hidden="true">${c.ic}</div>
          <div class="info"><b>${c.name}</b><small>${r.note ? esc(r.note) : '—'}</small></div>
          <span class="money">-${fmt(r.amount)}</span>
          <button class="del" data-id="${r.id}" aria-label="删除这条记录">✕</button>
        </div>`;
      }).join('');
  }).join('');
}

document.getElementById('list').addEventListener('click', e => {
  const btn = e.target.closest('.del');
  if (!btn || !confirm('确定删除这条记录吗？')) return;
  records = records.filter(r => r.id !== btn.dataset.id);
  save(); render();
});

/* ========== 导出 / 导入 ========== */
document.getElementById('exportBtn').onclick = () => {
  const blob = new Blob([JSON.stringify(records, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `ledger-${today()}.json`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};
document.getElementById('importFile').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const data = JSON.parse(rd.result);
      if (!Array.isArray(data)) throw 0;
      const valid = data.filter(r => r && r.id && typeof r.amount === 'number' && /^\d{4}-\d{2}-\d{2}$/.test(r.date));
      const ids = new Set(records.map(r => r.id));
      records = records.concat(valid.filter(r => !ids.has(r.id)).map(r => ({
        ...r, cat: r.cat === 'need' ? 'daily' : r.cat, note: String(r.note || '')
      })));
      save(); render();
      alert(`导入成功，共 ${valid.length} 条`);
    } catch { alert('文件格式不对'); }
  };
  rd.readAsText(f);
  e.target.value = '';
};

render();
</script>
</body>
</html>
